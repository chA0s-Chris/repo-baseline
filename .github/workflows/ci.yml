name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # The release workflows run exactly these checks and publish the archive or the package that this run packs.
  workflow_call:
    inputs:
      version:
        description: The profile version to pack; empty packs 0.0.0-dev.<short commit>.
        type: string
        default: ""
      tool-version:
        description: The tool version to pack; empty packs 0.0.0-dev.g<short commit>.
        type: string
        default: ""

# A new push to a pull request cancels its run that is still in progress; runs on main always finish. When a release
# workflow calls this one, github.workflow is the caller's name, so this group differs from the caller's fixed group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the workflows
        uses: raven-actions/actionlint@v2

      # The commands below are the ones documented in AGENTS.md.
      - name: Build and run the unit tests
        run: dotnet test RepoBaseline.slnx -p:TreatWarningsAsErrors=true

      # The packed-tool test runs against this package, which the tool's release workflow publishes. The g, as in
      # git describe, keeps the identifier valid SemVer when the short commit has only digits and starts with 0.
      - name: Pack the tool
        id: pack-tool
        env:
          TOOL_VERSION: ${{ inputs.tool-version }}
        run: |
          version="${TOOL_VERSION:-0.0.0-dev.g$(git rev-parse --short HEAD)}"
          dotnet pack src/RepoBaseline/RepoBaseline.csproj -o artifacts/tool -p:Version="${version}" -p:TreatWarningsAsErrors=true
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Test the tool
        env:
          TOOL_PACKAGE_DIR: artifacts/tool
          TOOL_PACKAGE_VERSION: ${{ steps.pack-tool.outputs.version }}
        run: bash tests/tool/run.sh

      - name: Test the shared code-style scripts
        run: bash tests/scripts/run.sh

      - name: Test the release packing
        run: bash tests/release/run.sh

      - name: Validate the Renovate preset and configuration
        run: npx --yes --package renovate@44.181.5 -- renovate-config-validator --strict --no-global renovate/default.json renovate.json

      - name: Pack the profile release
        env:
          VERSION: ${{ inputs.version }}
        run: bash tool/pack-profiles.sh "${VERSION:-0.0.0-dev.$(git rev-parse --short HEAD)}" artifacts/profiles

      - name: Upload the profile release
        uses: actions/upload-artifact@v7
        with:
          name: profiles
          path: artifacts/profiles/
          if-no-files-found: error

      - name: Upload the tool package
        uses: actions/upload-artifact@v7
        with:
          name: tool
          path: artifacts/tool/
          if-no-files-found: error
