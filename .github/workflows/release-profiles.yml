name: Release profiles

# The maintainer starts this workflow on main with the version to release, such as 0.6.0. It checks the version and the
# commit, checks that nuget.org has the tool version in tool/minimum-tool-version, runs the CI checks, and then creates
# the annotated tag v<version> and a GitHub release with the archive and checksum that this CI run packed. A run that
# fails partway is completed by re-running its failed jobs or by starting it again for the same commit. The scripts in
# tool/release/ do the work; tests/release/run.sh covers them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The SemVer 2.0.0 version to release, without a leading v, such as 0.6.0 or 0.7.0-preview.1
        required: true
        type: string
      from:
        description: Tag or commit to list changes from. Required when the stream has no published stable release.
        required: false
        type: string

permissions: {}

# A fixed group, so that two profile releases never run at once. It differs from the group that ci.yml computes.
concurrency:
  group: release-profiles
  cancel-in-progress: false

# The input reaches the scripts only through the environment.
env:
  STREAM: profiles
  VERSION: ${{ inputs.version }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the ref and the version
        id: validate
        run: bash tool/release/validate.sh

      - name: Check existing tags and releases and the minimum tool version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tool/release/preflight.sh

      # The exact version, as in update-release-drafts.yml: release-notes.sh refuses notes by the wording of this
      # version's warning about a missing previous release, which another version may change.
      - name: Render the release notes
        id: drafter
        uses: release-drafter/release-drafter@v7.11.0
        with:
          config-name: release-drafter-profiles.yml
          tag: ${{ steps.validate.outputs.tag }}
          name: ${{ steps.validate.outputs.tag }}
          commitish: ${{ github.sha }}
          from: ${{ inputs.from }}
          dry-run: true

      - name: Write the release notes
        env:
          DRAFTED_BODY: ${{ steps.drafter.outputs.body }}
          NOTES_FILE: release-notes/body.md
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tool/release/release-notes.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes/
          if-no-files-found: error
          overwrite: true

  # A called workflow cannot get more permissions than its calling job.
  ci:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}

  release:
    needs: [ prepare, ci ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the profile release
        uses: actions/download-artifact@v8
        with:
          name: profiles
          path: artifacts/profiles

      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      - name: Tag and publish the GitHub release
        env:
          ASSET_DIR: artifacts/profiles
          NOTES_FILE: release-notes/body.md
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tool/release/release.sh
